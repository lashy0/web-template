services:
  postgres:
    restart: unless-stopped
    mem_limit: "${POSTGRES_MEMORY_LIMIT:-2g}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

  redis:
    restart: unless-stopped
    mem_limit: "${REDIS_MEMORY_LIMIT:-512m}"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDISCLI_AUTH: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"

  prestart:
    image: "web-app-backend:${TAG:?TAG is required}"
    env_file:
      - .env
    environment:
      BACKEND_DEBUG: "false"

  backend:
    image: "web-app-backend:${TAG:?TAG is required}"
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      BACKEND_CORS_ORIGINS: "${BACKEND_CORS_ORIGINS:?BACKEND_CORS_ORIGINS is required}"
      BACKEND_DEBUG: "false"
      BACKEND_REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
