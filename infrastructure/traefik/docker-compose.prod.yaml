services:
  traefik:
    ports:
      - "80:80"
      - "443:443"
      # The dashboard is reachable only on the server's local-network address.
      - "${TRAEFIK_DASHBOARD_ADDRESS:?TRAEFIK_DASHBOARD_ADDRESS is required}:8080:8080"
    command:
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--ping=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=traefik-public"
      - "--providers.docker.constraints=Label(`traefik.constraint-label`,`traefik-public`)"
      - "--entrypoints.http.address=:80"
      - "--entrypoints.http.http.redirections.entrypoint.to=https"
      - "--entrypoints.http.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.https.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?ACME_EMAIL is required}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--log.level=INFO"
      - "--log.format=json"
      - "--accesslog=true"
      - "--accesslog.addinternals=true"
      - "--accesslog.format=json"
    volumes:
      - traefik-acme:/letsencrypt

volumes:
  traefik-acme:
