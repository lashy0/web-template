name: web-app

x-default-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

x-backend-environment: &backend-environment
  BACKEND_POSTGRES_HOST: postgres
  BACKEND_POSTGRES_PORT: 5432
  BACKEND_POSTGRES_DB: web_app
  BACKEND_REDIS_HOST: redis
  BACKEND_REDIS_PORT: 6379
  BACKEND_REDIS_DB: 0
  BACKEND_REDIS_PREFIX: web-app
  BACKEND_KRATOS_PUBLIC_URL: http://kratos:4433
  BACKEND_KRATOS_ADMIN_URL: http://kratos:4434
  BACKEND_HYDRA_PUBLIC_URL: http://hydra:4444
  BACKEND_HYDRA_ADMIN_URL: http://hydra:4445

x-backend-image: &backend-image
  image: "web-app-backend:${TAG:-dev}"
  build:
    context: ../../apps/backend
    dockerfile: Dockerfile
    args:
      BACKEND_VERSION: ${BACKEND_VERSION:-dev}

services:
  prestart:
    <<: *backend-image
    env_file:
      - ../../.env
    networks:
      - default
      - web-database
      - web-identity
    command: ["bash", "scripts/prestart.sh"]
    environment:
      <<: *backend-environment
      BACKEND_POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?POSTGRES_MIGRATOR_PASSWORD is required}

  backend:
    <<: *backend-image
    logging: *default-logging
    init: true
    env_file:
      - ../../.env
    networks:
      - default
      - traefik-public
      - web-database
      - web-identity
    labels:
      traefik.enable: "true"
      traefik.constraint-label: traefik-public
      traefik.docker.network: traefik-public
      traefik.http.routers.api.rule: "Host(`api.${BASE_DOMAIN:?BASE_DOMAIN is required}`)"
      traefik.http.routers.api.entrypoints: http
      traefik.http.services.api.loadbalancer.server.port: "8000"
    depends_on:
      prestart:
        condition: service_completed_successfully
    command: ["bash", "scripts/start.sh"]
    environment:
      <<: *backend-environment
      BACKEND_POSTGRES_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}
      BACKEND_REDIS_PASSWORD: ${REDIS_RUNTIME_PASSWORD:?REDIS_RUNTIME_PASSWORD is required}
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 1m
      timeout: 10s
      retries: 5
      start_period: 20s
      start_interval: 5s

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1400"
  traefik-public:
    name: traefik-public
    external: true
  web-database:
    name: web-database
    external: true
  web-identity:
    name: web-identity
    external: true
