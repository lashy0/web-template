services:
  prestart:
    image: "web-app-backend:${TAG:?TAG is required}"
    environment:
      BACKEND_DEBUG: "false"

  backend:
    image: "web-app-backend:${TAG:?TAG is required}"
    restart: unless-stopped
    labels:
      traefik.http.routers.api.entrypoints: https
      traefik.http.routers.api.tls: "true"
      traefik.http.routers.api.tls.certresolver: letsencrypt
      traefik.http.routers.frontend-api.rule: "Host(`app.${BASE_DOMAIN:?BASE_DOMAIN is required}`) && PathPrefix(`/api`)"
      traefik.http.routers.frontend-api.entrypoints: https
      traefik.http.routers.frontend-api.priority: "100"
      traefik.http.routers.frontend-api.middlewares: frontend-api-strip
      traefik.http.routers.frontend-api.service: api
      traefik.http.routers.frontend-api.tls: "true"
      traefik.http.routers.frontend-api.tls.certresolver: letsencrypt
      traefik.http.middlewares.frontend-api-strip.stripprefix.prefixes: /api
    environment:
      BACKEND_CORS_ORIGINS: "${BACKEND_CORS_ORIGINS:?BACKEND_CORS_ORIGINS is required}"
      BACKEND_DEBUG: "false"

  frontend:
    image: "web-app-frontend:${TAG:?TAG is required}"
    build:
      context: ../../apps/frontend
      dockerfile: Dockerfile
      additional_contexts:
        workspace: ../..
        api_client: ../../packages/api-client
        ui: ../../packages/ui
    restart: unless-stopped
    init: true
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - traefik-public
    labels:
      traefik.enable: "true"
      traefik.constraint-label: traefik-public
      traefik.docker.network: traefik-public
      traefik.http.routers.frontend.rule: "Host(`app.${BASE_DOMAIN:?BASE_DOMAIN is required}`)"
      traefik.http.routers.frontend.entrypoints: https
      traefik.http.routers.frontend.priority: "1"
      traefik.http.routers.frontend.service: frontend
      traefik.http.routers.frontend.tls: "true"
      traefik.http.routers.frontend.tls.certresolver: letsencrypt
      traefik.http.services.frontend.loadbalancer.server.port: "8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
