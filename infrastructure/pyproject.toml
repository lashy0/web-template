[project]
name = "infrastructure-cli"
version = "0.1.0"
description = "Operational CLI for the Web App infrastructure"
readme = "README.md"
requires-python = ">=3.13,<4"
dependencies = [
    "bcrypt>=4.3.0,<6.0.0",
    "rich>=15.0.0,<16.0.0",
    "typer>=0.27.0,<1.0.0",
]

[project.scripts]
infra = "cli.main:main"
otk = "cli.otk:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy<3.0.0,>=2.2.0",
    "ruff>=0.15.20",
    "ty>=0.0.57",
]

[tool.uv.build-backend]
module-name = "cli"
module-root = ""

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
exclude = [".venv"]
