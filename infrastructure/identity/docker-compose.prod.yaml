services:
  kratos-migrate:
    mem_limit: 512m
    environment:
      LOG_FORMAT: json
      LOG_LEVEL: info

  kratos:
    mem_limit: 1g
    restart: unless-stopped
    environment:
      SERVE_PUBLIC_BASE_URL: "https://${APP_HOST:?APP_HOST is required}/.ory/kratos/"
      SELFSERVICE_DEFAULT_BROWSER_RETURN_URL: "https://${APP_HOST:?APP_HOST is required}/"
      SELFSERVICE_ALLOWED_RETURN_URLS: "https://${APP_HOST:?APP_HOST is required}"
      SELFSERVICE_FLOWS_ERROR_UI_URL: "https://${APP_HOST:?APP_HOST is required}/auth/error"
      SELFSERVICE_FLOWS_LOGIN_UI_URL: "https://${APP_HOST:?APP_HOST is required}/login"
      SELFSERVICE_FLOWS_LOGOUT_AFTER_DEFAULT_BROWSER_RETURN_URL: "https://${APP_HOST:?APP_HOST is required}/login"
      COOKIES_SECURE: "true"
      LOG_FORMAT: json
      LOG_LEVEL: info
    labels:
      traefik.http.routers.kratos-login.entrypoints: https
      traefik.http.routers.kratos-login.tls: "true"
      traefik.http.routers.kratos-login.tls.certresolver: letsencrypt
      traefik.http.routers.kratos-browser.entrypoints: https
      traefik.http.routers.kratos-browser.tls: "true"
      traefik.http.routers.kratos-browser.tls.certresolver: letsencrypt

  hydra-migrate:
    mem_limit: 512m
    environment:
      LOG_FORMAT: json
      LOG_LEVEL: info

  hydra:
    mem_limit: 1g
    restart: unless-stopped
    environment:
      URLS_SELF_ISSUER: "https://${APP_HOST:?APP_HOST is required}/.ory/hydra"
      LOG_FORMAT: json
      LOG_LEVEL: info
    labels:
      traefik.http.routers.hydra-token.entrypoints: https
      traefik.http.routers.hydra-token.tls: "true"
      traefik.http.routers.hydra-token.tls.certresolver: letsencrypt
