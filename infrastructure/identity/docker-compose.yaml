name: web-identity

x-default-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

x-kratos-image: &kratos-image
  image: oryd/kratos:v26.2.0
  logging: *default-logging

x-kratos-dsn: &kratos-dsn
  DSN: "postgres://kratos_runtime:${KRATOS_POSTGRES_RUNTIME_PASSWORD:?KRATOS_POSTGRES_RUNTIME_PASSWORD is required}@postgres:5432/kratos?sslmode=disable"

x-hydra-image: &hydra-image
  image: oryd/hydra:v26.2.0
  logging: *default-logging

x-hydra-dsn: &hydra-dsn
  DSN: "postgres://hydra_runtime:${HYDRA_POSTGRES_RUNTIME_PASSWORD:?HYDRA_POSTGRES_RUNTIME_PASSWORD is required}@postgres:5432/hydra?sslmode=disable"

services:
  kratos-migrate:
    <<: *kratos-image
    restart: "no"
    command: ["migrate", "sql", "-e", "--yes"]
    environment:
      DSN: "postgres://kratos_migrator:${KRATOS_POSTGRES_MIGRATOR_PASSWORD:?KRATOS_POSTGRES_MIGRATOR_PASSWORD is required}@postgres:5432/kratos?sslmode=disable"
      SQA_OPT_OUT: "true"
    networks:
      - web-identity
      - web-database

  kratos:
    <<: *kratos-image
    restart: unless-stopped
    command: ["serve", "--sqa-opt-out", "--config", "/etc/config/kratos/kratos.yaml"]
    environment:
      <<: *kratos-dsn
      CIPHERS_ALGORITHM: "xchacha20-poly1305"
      SECRETS_COOKIE: ${KRATOS_COOKIE_SECRET:?KRATOS_COOKIE_SECRET is required}
      SECRETS_CIPHER: ${KRATOS_CIPHER_SECRET:?KRATOS_CIPHER_SECRET is required}
      LOG_LEAK_SENSITIVE_VALUES: "false"
    volumes:
      - ./kratos/kratos.yaml:/etc/config/kratos/kratos.yaml:ro
      - ./kratos/identity.schema.json:/etc/config/kratos/identity.schema.json:ro
    networks:
      - web-identity
      - web-database
      - traefik-public
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "kratos",
          "remote",
          "status",
          "--endpoint",
          "http://127.0.0.1:4433",
          "--quiet",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
      start_interval: 2s
    labels:
      traefik.enable: "true"
      traefik.constraint-label: traefik-public
      traefik.docker.network: traefik-public
      traefik.http.services.kratos-public.loadbalancer.server.port: "4433"
      traefik.http.routers.kratos-login.rule: "Host(`app.${BASE_DOMAIN:?BASE_DOMAIN is required}`) && (Path(`/self-service/login`) || PathPrefix(`/self-service/login/`))"
      traefik.http.routers.kratos-login.entrypoints: http
      traefik.http.routers.kratos-login.priority: "300"
      traefik.http.routers.kratos-login.middlewares: kratos-login-rate-limit
      traefik.http.routers.kratos-login.service: kratos-public
      traefik.http.middlewares.kratos-login-rate-limit.ratelimit.average: "10"
      traefik.http.middlewares.kratos-login-rate-limit.ratelimit.period: 1m
      traefik.http.middlewares.kratos-login-rate-limit.ratelimit.burst: "5"
      traefik.http.routers.kratos-browser.rule: "Host(`app.${BASE_DOMAIN:?BASE_DOMAIN is required}`) && (Path(`/self-service/logout`) || PathPrefix(`/self-service/logout/`) || Path(`/self-service/errors`) || PathPrefix(`/self-service/errors/`) || Path(`/sessions/whoami`) || Path(`/schemas`) || PathPrefix(`/schemas/`))"
      traefik.http.routers.kratos-browser.entrypoints: http
      traefik.http.routers.kratos-browser.priority: "200"
      traefik.http.routers.kratos-browser.service: kratos-public

  hydra-migrate:
    <<: *hydra-image
    restart: "no"
    command: ["migrate", "sql", "-e", "--yes"]
    environment:
      DSN: "postgres://hydra_migrator:${HYDRA_POSTGRES_MIGRATOR_PASSWORD:?HYDRA_POSTGRES_MIGRATOR_PASSWORD is required}@postgres:5432/hydra?sslmode=disable"
      SQA_OPT_OUT: "true"
    networks:
      - web-identity
      - web-database

  hydra:
    <<: *hydra-image
    restart: unless-stopped
    command: ["serve", "all", "--sqa-opt-out", "--config", "/etc/config/hydra/hydra.yaml"]
    environment:
      <<: *hydra-dsn
      SECRETS_SYSTEM: ${HYDRA_SYSTEM_SECRET:?HYDRA_SYSTEM_SECRET is required}
      URLS_SELF_ISSUER: "http://oauth.${BASE_DOMAIN:?BASE_DOMAIN is required}"
      LOG_LEAK_SENSITIVE_VALUES: "false"
    volumes:
      - ./hydra/hydra.yaml:/etc/config/hydra/hydra.yaml:ro
    networks:
      - web-identity
      - web-database
      - traefik-public
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://127.0.0.1:4445/health/ready",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      traefik.enable: "true"
      traefik.constraint-label: traefik-public
      traefik.docker.network: traefik-public
      traefik.http.services.hydra-public.loadbalancer.server.port: "4444"
      traefik.http.routers.hydra-public.rule: "Host(`oauth.${BASE_DOMAIN:?BASE_DOMAIN is required}`)"
      traefik.http.routers.hydra-public.entrypoints: http
      traefik.http.routers.hydra-public.service: hydra-public

networks:
  web-identity:
    name: web-identity
    external: true
  web-database:
    name: web-database
    external: true
  traefik-public:
    name: traefik-public
    external: true
