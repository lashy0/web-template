# $schema: https://raw.githubusercontent.com/ory/kratos/v26.2.0/.schemastore/config.schema.json
version: v0.13.0

dsn: ""

serve:
  public:
    port: 4433
    cors:
      enabled: false
  admin:
    port: 4434
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: /

  methods:
    password:
      enabled: true
      config:
        min_password_length: 12
        identifier_similarity_check_enabled: true
        haveibeenpwned_enabled: false
    code:
      enabled: false
    link:
      enabled: false
    lookup_secret:
      enabled: false
    oidc:
      enabled: false
    passkey:
      enabled: false
    profile:
      enabled: false
    totp:
      enabled: false
    webauthn:
      enabled: false

  flows:
    login:
      ui_url: /login
    registration:
      enabled: false
    recovery:
      enabled: false
    verification:
      enabled: false

log:
  leak_sensitive_values: false

hashers:
  algorithm: argon2
  argon2:
    memory: 128MB
    iterations: 2
    parallelism: 1
    salt_length: 16
    key_length: 32

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

session:
  lifespan: 12h
  earliest_possible_extend: 12h
  cookie:
    persistent: false

cookies:
  path: /
  same_site: Lax
