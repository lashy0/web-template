name: otk-app-frontend

x-default-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

x-frontend-image: &frontend-image
  image: "otk-app-frontend:${FRONTEND_TAG:-dev}"
  build:
    context: ../../apps/frontend
    dockerfile: Dockerfile
    additional_contexts:
      workspace: ../..
      api_client: ../../packages/api-client
      ui: ../../packages/ui

services:
  frontend:
    <<: *frontend-image
    logging: *default-logging
    init: true
    networks:
      - traefik-public
    labels:
      traefik.enable: "true"
      traefik.constraint-label: traefik-public
      traefik.docker.network: traefik-public
      # Everything on the host that /api and /.ory do not claim.
      traefik.http.routers.frontend.rule: "Host(`${APP_HOST:?APP_HOST is required}`)"
      traefik.http.routers.frontend.entrypoints: http
      traefik.http.routers.frontend.priority: "1"
      traefik.http.routers.frontend.service: frontend

networks:
  traefik-public:
    name: traefik-public
    external: true
