services:
  frontend:
    build:
      target: development
    labels:
      traefik.http.services.frontend.loadbalancer.server.port: "5173"
    environment:
      # Vite answers only the hosts it knows; Traefik keeps the application host.
      APP_HOST: ${APP_HOST:?APP_HOST is required}
    working_dir: /app/apps/frontend
    command: ["./node_modules/.bin/vite", "--host", "0.0.0.0"]
    volumes:
      - ../../apps/frontend/src:/app/apps/frontend/src
      - ../../packages/api-client/src:/app/packages/api-client/src
      - ../../packages/ui/src:/app/packages/ui/src
