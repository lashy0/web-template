# Alembic configuration for a single asynchronous database.

[alembic]

# Path to the Alembic migration environment.
script_location = %(here)s/alembic

# Name migration files using the creation date, revision ID, and message
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Add the project root to Python's import path
prepend_sys_path = .

# Generate migration timestamps in UTC
timezone = UTC

# Maximum number of characters used for the message-derived filename slug
truncate_slug_length = 40

# Load env.py for plain revision commands even without --autogenerate
revision_environment = false

# Do not load compiled migration files without corresponding source files
sourceless = false

# Store migration revision files in the standard versions directory
version_locations = %(here)s/alembic/versions

# Use the platform-specific separator for path lists
path_separator = os

# Do not search for migration revisions in nested directories
recursive_version_locations = false

# Write generated migration files using UTF-8 encoding
output_encoding = utf-8

# The database URL is injected by env.py from application settings
sqlalchemy.url = 


[post_write_hooks]

# Apply safe Ruff fixes before formatting the generated migration
hooks = ruff_check, ruff_format

ruff_check.type = module
ruff_check.module = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME

ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME


# Logging configuration

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
