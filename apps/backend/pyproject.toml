[project]
name = "backend"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "alembic[tz]>=1.18.5,<2.0.0",
    "authlib>=1.8.0,<2.0.0",
    "cryptography>=46.0.0,<47.0.0",
    "fastapi[standard]>=0.139.0",
    "httpx2>=2.9.1,<3.0.0",
    "loguru>=0.7.3,<8.0.0",
    "ory-hydra-client==26.2.0",
    "ory-kratos-client==26.2.0",
    "psycopg[binary]>=3.3.4,<4.0.0",
    "pydantic>=2.13.4,<3.0.0",
    "pydantic-settings>=2.14.2,<3.0.0",
    "redis>=8.0.1,<9.0.0",
    "sqlalchemy>=2.0.51,<3.0.0",
]

[dependency-groups]
dev = [
    "mypy>=2.2.0,<3.0.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "pytest-mock>=3.15.1,<4.0.0",
    "pytest-timeout>=2.4.0,<3.0.0",
    "ruff>=0.15.20",
    "ty>=0.0.57",
]

[tool.uv]
package = false

[tool.uv.sources]
ory-hydra-client = { git = "https://github.com/ory/hydra-client-python.git", rev = "v26.2.0" }
ory-kratos-client = { git = "https://github.com/ory/kratos-client-python.git", rev = "v26.2.0" }

[tool.mypy]
strict = true
exclude = [".venv", "alembic"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = [
    "-ra",
    "-m",
    "not integration",
    "--strict-config",
    "--strict-markers",
    "--verbose",
]
markers = [
    "unit: marks tests as unit tests",
    "api: marks in-process HTTP API tests with external dependencies mocked",
    "integration: marks tests that require real external infrastructure",
    "slow: marks tests as slow running"
]
asyncio_mode = "auto"
strict_xfail = true
timeout = 20
