[project]
name = "pak-simulator"
version = "1.0.0"
description = "PAK simulator that drives the machine verification API for live demos"
readme = "README.md"
requires-python = ">=3.13,<4"
dependencies = [
    "httpx2>=2.13.1,<3",
    "msgspec>=0.22.0",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.13,<3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rich>=15,<16",
    "tenacity>=9.1,<10",
    "typer>=0.27,<1",
]

[project.scripts]
pak-sim = "pak_simulator.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    { include-group = "linting" },
    { include-group = "test" },
]
linting = [
    "mypy>=2.3.1,<3.0.0",
    "ruff>=0.16.9",
    "types-jsonschema>=4,<5",
    "types-pyyaml>=6.0.12.20260906",
]
test = [
    "anyio>=4.15.1",
    "jsonschema>=4.18,<5",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ARG",
    "T20",
    "RUF",
]
ignore = [
    "E501",
    "B008",
    "B904",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["pak_simulator", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG001"]

[tool.mypy]
mypy_path = "src"
python_version = "3.13"
strict = true
exclude = [".venv"]

[tool.pytest.ini_options]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "-v",
    "-ra",
    "--basetemp=.pytest-basetemp",
]
testpaths = ["tests"]
markers = [
    "unit: fast, isolated tests without external services",
    "integration: contract checks against the exported backend OpenAPI",
]
filterwarnings = ["error::RuntimeWarning"]

[tool.coverage.run]
branch = true
source = ["pak_simulator"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@overload"]
