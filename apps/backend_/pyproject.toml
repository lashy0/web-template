[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "advanced-alchemy[uuid]>=1.11.0,<2.0.0",
    "alembic[tz]>=1.20.0,<2.0.0",
    "litestar[standard]>=2.24.0,<3.0.0",
    "loguru>=0.7.3",
    "psycopg[binary,pool]>=3.3.5,<4.0.0",
    "pydantic>=2.13.5,<3.0.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "python-dotenv>=1.2.3",
    "ory-hydra-client==26.2.0",
    "ory-kratos-client==26.2.0",
    "cryptography>=46.0.5,<47.0.0",
    "litestar-autowire==0.2.0",
    "redis>=5.2,<8",
    "litestar-saq[hiredis]>=0.8.0",
]

[project.scripts]
app = "app.__main__:run_cli"

[dependency-groups]
dev = [
    { include-group = "linting" },
    { include-group = "test" },
]

linting = [
    "basedpyright",
    "mypy>=2.3.1,<3.0.0",
    "ruff>=0.16.7",
    "ty>=0.0.81",
]

test = [
    "pytest>=9.1.1,<10.0.0",
    "pytest-databases[postgres]",
    "pytest-xdist",
    "pytest-mock",
    "pytest-sugar",
    "polyfactory",
    "anyio",
    "asyncpg",
    "docker>=7.2.0,<8",
    "types-docker>=7.2.0.20260923",
    "pytest-cov>=7.1.0",
]

[tool.uv]
package = false

[tool.uv.sources]
ory-hydra-client = { git = "https://github.com/ory/hydra-client-python.git", rev = "v26.2.0" }
ory-kratos-client = { git = "https://github.com/ory/kratos-client-python.git", rev = "v26.2.0" }

# Ruff
[tool.ruff]
line-length = 120
target-version = "py313"

exclude = [
    ".venv",
    "app/db/migrations/versions",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ARG",
    "T20",
    "RUF",
]

ignore = [
    "E501",
    "B008",
    "B904",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"app/db/migrations/*.py" = [
    "ARG001",
]
"tests/**/*.py" = [
    "S101",
    "ARG001",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# BasedPyright
[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"

include = [
    "app",
    "tests",
]

exclude = [
    ".venv",
    "app/db/migrations",
]

reportMissingTypeStubs = false
reportPrivateUsage = false
reportUnnecessaryTypeIgnoreComment = true

# mypy
[tool.mypy]
python_version = "3.13"
strict = true

exclude = [
    ".venv",
    "app/db/migrations",
]

show_error_codes = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

# pytest
[tool.pytest.ini_options]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "-v",
    "-ra",
    "-n",
    "auto",
    "--basetemp=.pytest-basetemp",
]

markers = [
    "unit: marks tests as unit tests (fast, isolated)",
    "integration: marks tests as integration tests (slower, database)",
    "auth: marks tests related to authentication",
    "services: marks tests for service layer",
    "security: marks tests for security features",
]

python_classes = ["Test*"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]

testpaths = ["tests"]

filterwarnings = [
    # Emitted by Advanced Alchemy 1.11 internally; the current PyPI release
    # still calls this deprecated compatibility hook.
    "ignore:Call to deprecated function 'set_async_context':DeprecationWarning:advanced_alchemy\\._listeners",
]

# coverage: `uv run pytest --cov` on the full suite
[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/db/migrations/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
]
